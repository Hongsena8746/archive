<!--필드오류-->
{% for field, errors in form.errors.items() %}
<div class="alert alert-danger" role="alert">
  <strong>{{ form[field].label }}</strong>: {{ ', '.join(errors) }} <!--오류메세지들을  콤마로 연결 -->
</div>
{% endfor %}

{% for massage in get_flashed_messages() %}
<div class="alert alert-danger" role="alert">
  {{ message }}
</div>
{% endfor %}
